# dblib — full stack: Apache/PHP app + MariaDB.
#
# One compose file for every target:
#   * local dev:            docker compose up --build   → http://localhost:8083/
#   * Dokploy (Compose):    add a domain in the Domains tab → service "app", port 80
#   * plain Docker VM:      docker compose up -d --build → http://<vm-ip>:8083/
#
# Nothing here is Dokploy-specific. Dokploy attaches its own proxy network to
# each service at deploy time, so the same file runs unchanged on a bare VM.
# Copy .env.example to .env (or set the variables in Dokploy) to override
# ports / credentials / the first teacher.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DBLIB_DB_ROOT_PASS:-rootpass}
      # Passed through to docker/initdb so the provisioning account it creates
      # matches what the app connects with.
      DBLIB_DB_ADMIN_USER: ${DBLIB_DB_ADMIN_USER:-dblib_admin}
      DBLIB_DB_ADMIN_PASS: ${DBLIB_DB_ADMIN_PASS:-dblib_admin_pw}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DBLIB_DB_HOST: db
      DBLIB_DB_PORT: 3306
      DBLIB_DB_NAME: dblib_meta
      DBLIB_DB_ADMIN_USER: ${DBLIB_DB_ADMIN_USER:-dblib_admin}
      DBLIB_DB_ADMIN_PASS: ${DBLIB_DB_ADMIN_PASS:-dblib_admin_pw}
      DBLIB_DEBUG: ${DBLIB_DEBUG:-false}
      DBLIB_STUDENT_USER_HOST: '%'
      DBLIB_KEY_FILE: /var/dblib-secrets/credential.key
      # First-run teacher login (created idempotently by the entrypoint).
      DBLIB_TEACHER_EMAIL: ${DBLIB_TEACHER_EMAIL:-teacher@dblib.local}
      DBLIB_TEACHER_PASSWORD: ${DBLIB_TEACHER_PASSWORD:-changeme}
      DBLIB_TEACHER_NAME: ${DBLIB_TEACHER_NAME:-Teacher}
      # Reverse proxies whose X-Forwarded-* headers Apache should trust, so the
      # access log shows the real client and HTTPS is detected behind Traefik.
      # Default covers Docker's own bridge networks (where Dokploy's Traefik
      # lives). Space-separated CIDRs; set to "" to disable when the app faces
      # clients directly with no proxy in front.
      DBLIB_TRUSTED_PROXIES: ${DBLIB_TRUSTED_PROXIES-172.16.0.0/12}
    ports:
      # Direct host access. Harmless alongside a Dokploy domain, and the only
      # route on a bare VM. Bind to 127.0.0.1:PORT if a host-level proxy owns
      # the public side.
      - "${DBLIB_HTTP_PORT:-8083}:80"
    volumes:
      # The credential-encryption key persists here, outside the web root.
      - secrets:/var/dblib-secrets
    healthcheck:
      # Apache only starts listening after the entrypoint has migrated the
      # schema, so a port probe is a real "ready" signal (Traefik/Dokploy wait
      # for it before routing traffic).
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s

volumes:
  db-data:
  secrets:
