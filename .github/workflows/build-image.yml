# Builds the dblib app image on GitHub's runners and pushes it to GHCR, so the
# server only ever pulls a finished image. Building on the VPS itself (pulling
# the PHP base image, compiling pdo_mysql) alongside Traefik/Dokploy/MariaDB is
# what tipped it over on 2026-09-08.
#
# Tags: ghcr.io/<owner>/dblib:<branch>  (e.g. :deploy)  and  :sha-<short sha>
name: Build image

on:
  push:
    branches: [deploy, main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dblib
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
