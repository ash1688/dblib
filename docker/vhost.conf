# dblib Apache vhost for Docker.
#
# Unlike the XAMPP .htaccess (which lives at the /dblib/ subpath), the container
# serves the app at the web root. AllowOverride is None so the in-tree .htaccess
# (with its RewriteBase /dblib/) is ignored — every rule lives here instead.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride None
        Require all granted

        # Front controller: serve real files/dirs (assets) directly, route
        # everything else through index.php.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ index.php [L]
    </Directory>

    # Defense in depth: never serve config, source, secrets, or schema even if
    # something is misplaced (mirrors the .htaccess deny rules).
    <FilesMatch "\.(sql|md)$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "^/var/www/html/(config|src|cli|tests|sql)/">
        Require all denied
    </DirectoryMatch>

    # Log to the container's stdout/stderr so `docker compose logs` shows them.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
