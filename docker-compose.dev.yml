# Local development override: build the app image from this checkout instead
# of pulling the prebuilt one. Use together with the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# (Named .dev.yml rather than .override.yml on purpose, so a server that runs
# plain `docker compose up` can never pick it up and start building.)
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dblib-app:dev
    pull_policy: build
